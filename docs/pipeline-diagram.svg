<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="300" fill="#FFFFFF" />

  <!-- Agent boxes -->
  <g font-size="15" font-weight="600" fill="#1E293B">
    <g>
      <rect x="20" y="30" width="160" height="60" rx="8" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.5" />
      <text x="100" y="55" text-anchor="middle">Scraper</text>
      <text x="100" y="75" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">agent</text>
    </g>
    <g>
      <rect x="220" y="30" width="160" height="60" rx="8" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.5" />
      <text x="300" y="55" text-anchor="middle">Design</text>
      <text x="300" y="75" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">agent</text>
    </g>
    <g>
      <rect x="420" y="30" width="160" height="60" rx="8" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.5" />
      <text x="500" y="55" text-anchor="middle">Backend</text>
      <text x="500" y="75" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">agent</text>
    </g>
    <g>
      <rect x="620" y="30" width="160" height="60" rx="8" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.5" />
      <text x="700" y="55" text-anchor="middle">QA</text>
      <text x="700" y="75" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">agent</text>
    </g>
    <g>
      <rect x="820" y="30" width="160" height="60" rx="8" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.5" />
      <text x="900" y="55" text-anchor="middle">Integration</text>
      <text x="900" y="75" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">lead agent</text>
    </g>
  </g>

  <!-- Arrows between agents (sequential pipeline, one agent active at a time) -->
  <g stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="180" y1="60" x2="216" y2="60" />
    <line x1="380" y1="60" x2="416" y2="60" />
    <line x1="580" y1="60" x2="616" y2="60" />
    <line x1="780" y1="60" x2="816" y2="60" />
  </g>

  <!-- Shared contract layer -->
  <rect x="20" y="190" width="960" height="60" rx="8" fill="#FFF7E6" stroke="#D97706" stroke-width="1.5" />
  <text x="500" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#1E293B">
    .pipeline/*.json — the shared contract
  </text>
  <text x="500" y="235" text-anchor="middle" font-size="11" font-weight="400" fill="#78350F">
    kickoff · scraper-output · design-lock · mockup-approval · qa-report · signoff · pipeline-status
  </text>

  <!-- Dashed read/write lines from each agent down to the contract layer -->
  <g stroke="#94A3B8" stroke-width="1.25" stroke-dasharray="4 4">
    <line x1="100" y1="90" x2="100" y2="190" />
    <line x1="300" y1="90" x2="300" y2="190" />
    <line x1="500" y1="90" x2="500" y2="190" />
    <line x1="700" y1="90" x2="700" y2="190" />
    <line x1="900" y1="90" x2="900" y2="190" />
  </g>

  <text x="500" y="280" text-anchor="middle" font-size="12" fill="#64748B">
    Agents never call each other directly — each one reads what the last agent left behind, and writes its own slice.
  </text>
</svg>
